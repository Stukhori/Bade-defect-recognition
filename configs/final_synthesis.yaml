extends: base.yaml

project:
  phase: 10

experiment:
  name: phase10_final_statistical_synthesis
  seed: 20260831
  output_root: experiments/summaries/phase10_final_synthesis_v1

method:
  family: frozen_result_synthesis
  name: paired_stratified_bootstrap_and_descriptive_consolidation_v1

training:
  train_fraction: 1.0
  epochs: 0

evaluation:
  split: test
  primary_metric: macro_f1
  secondary_metrics: [accuracy, balanced_accuracy, macro_precision, macro_recall]
  classes: [craze, corrosion, surface_injure, thunderstrike, crack, hide_craze]
  methods: [hog, lbp, resnet18, mobilenet_v3_small]
  cnn_methods: [resnet18, mobilenet_v3_small]
  deterministic_methods: [hog, lbp]
  cnn_seeds: [17, 29, 43]

statistical_plan:
  version: phase10_statistical_plan_v1
  frozen_before_generation: true
  primary_metric: macro_f1
  secondary_metrics: [accuracy, balanced_accuracy, macro_precision, macro_recall, per_class_precision, per_class_recall, per_class_f1]
  comparison_unit: frozen_test_classification_instance
  test_instances: 162
  test_source_images: 109
  pairing: same_resampled_test_instances_for_every_method_and_comparison
  bootstrap:
    method: paired_class_stratified_nonparametric_percentile
    resamples: 5000
    seed: 20260831
    confidence_level: 0.95
    interval: equal_tailed_percentile
    stratification: true_class
    common_indices_across_methods: true
  cnn_treatment: calculate_each_seed_metric_within_each_resample_then_average_three_seed_metrics
  deterministic_treatment: one_frozen_prediction_vector_with_sample_bootstrap_ci_and_seed_sd_not_applicable
  missing_value_policy: reject_missing_nonfinite_or_inconsistent_rows
  pairwise_comparisons:
    - [hog, lbp]
    - [hog, resnet18]
    - [hog, mobilenet_v3_small]
    - [lbp, resnet18]
    - [lbp, mobilenet_v3_small]
    - [resnet18, mobilenet_v3_small]
  p_values: omitted
  multiple_comparison_policy: no_p_value_family; six_pointwise_estimation_intervals_reported_without_familywise_significance_claims
  inferential_scope: paired_sample_bootstrap_intervals_for_clean_test_metrics_and_predeclared_pairwise_macro_f1_differences
  descriptive_scope: data_efficiency_robustness_error_analysis_human_review_and_cross_phase_tradeoffs
  interpretation_limits:
    - three_cnn_seeds_do_not_support_population_inference_about_training_randomness
    - bootstrap_intervals_describe_uncertainty_over_the_fixed_test_sample_structure_not_new_datasets_or_deployments
    - interval_exclusion_of_zero_is_not_reported_as_a_multiplicity_controlled_significance_test
    - synthetic_corruption_grid_points_are_fixed_not_random_operational_environments
    - single_reviewer_judgments_are_descriptive_not_objective_ground_truth
    - gradcam_overlap_does_not_establish_model_mechanism_or_causality

data_efficiency:
  fractions: [0.25, 0.50, 0.75, 1.00]
  full_data_retention_threshold: 0.95
  threshold_predeclared_in_phase7: true
  normalized_auc: trapezoidal_macro_f1_over_fraction_0.25_to_1.00_divided_by_0.75
  inference: descriptive_only

robustness:
  families: [gaussian_blur, resolution, brightness, jpeg]
  severities: [mild, moderate, severe]
  condition_grid_random_sample: false
  inference: descriptive_only

outputs:
  result_id: phase10_final_synthesis_v1
  summary_root: experiments/summaries/phase10_final_synthesis_v1
  figures_root: figures/phase10
  reproduction_scratch_root: experiments/cache/phase10_reproduction
  canonical_tables:
    - experimental_data_summary
    - clean_method_comparison
    - clean_per_class_performance
    - data_efficiency_summary
    - robustness_retention_summary
    - severe_corruption_summary
    - paired_macro_f1_differences
    - error_human_review_summary
    - cross_phase_tradeoffs
    - reproducibility_fingerprints
  canonical_figures:
    - clean_macro_f1_bootstrap_ci
    - clean_per_class_f1
    - data_efficiency_learning_curves
    - robustness_curves
    - severe_retention_heatmap
    - severe_per_class_f1
    - phase9_human_review_summary

upstream:
  phase9_freeze_commit: 89e18d48ef2dd7c2cef35e9b7a4fa6fe72c92ea9
  processed_dataset_fingerprint: 4bd754a1015be2ec99c88a57a23586e286b03cc178ee148b298850e5ca848991
  phase7_result_id: phase7_data_efficiency_v1
  phase8_result_id: phase8_robustness_v1
  phase8_corruption_config_fingerprint: a6a9e40c9c3de7130892df3cf49698f95718ce9241c8a963849016ce7adc1d57
  phase8_robustness_dataset_fingerprint: da0eda8956adfef63e001d0d1614279a907c46feffc5e2f180c5acdbe89987db
  phase9a_input_fingerprint: dbedb680481e6477b94ff623858e1db4c1981f2b8f5491d0e04a99b5672173b1
  phase9a_output_fingerprint: 14e500fd94fa871bbe1e6bee6494d3158fe003c3799e0ccfbcab8e549adf80fa
  phase9b_config_fingerprint: ac60d00ffb9b0b729c334a9b5b76bf0f3630c09fd7e5b78b7f304f3048263830
  phase9b_output_fingerprint: dc940fe0a802d285b236224b04197f7fb7d6b0ef73062a5bdddbb1238de286d3
  pass_a_sha256: 3b6548d8e6a1240c224f156f9266c5025cc099816d73a8c81960173fe9c8423e
  pass_b_sha256: 0f5258e06a4e854d338705bcf1d38ced048f0652a99ccc4639b18c3baae1cd96
