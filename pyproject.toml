[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windblade"
version = "0.1.0"
description = "Reproducible experimental infrastructure for wind-turbine blade defect recognition research."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
  "joblib>=1.4,<2",
  "scikit-image>=0.24,<1",
  "scikit-learn>=1.6,<2",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
